[project]
name = "memory-store"
version = "0.1.0"
description = "File-based memory for agents: JSON fact lists and markdown documents behind MCP, a CLI and a Python API"
readme = "README.md"
authors = [
    { name = "patrickab", email = "patrick.a.bitzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
memory-store = "memory_store.cli:main"
memory-store-mcp = "memory_store.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
